services:
  studyhub_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-studyhub_user}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD non impostata, copia .env.example in .env}"
      POSTGRES_DB: ${DB_NAME:-studyhub_db}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - studyhub_db:/var/lib/postgresql/data

volumes:
  studyhub_db: