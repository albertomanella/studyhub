server.port=8081
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Credenziali e configurazione locale: file .env nella root del repository
# (stesso file letto da docker compose). Viene cercato sia nella cartella di
# avvio sia in quella superiore, così funziona lanciando il backend dalla root
# o da backend/. Le variabili d'ambiente reali hanno la precedenza.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:studyhub_db}
spring.datasource.username=${DB_USERNAME:studyhub_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
app.upload.dir=./uploads
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# V99__seed_data.sql è intenzionalmente numerata alta per restare sempre l'ultima
# migration applicata (dati di riferimento). Qualunque nuova migration di schema
# "vera" avrà quindi sempre un numero minore di 99 e verrebbe rifiutata da Flyway
# come fuori ordine, senza questa opzione.
spring.flyway.out-of-order=true