server.port=8081
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.datasource.url=jdbc:postgresql://localhost:5432/studyhub_db
spring.datasource.username=studyhub_user
spring.datasource.password=studyhub2026

spring.jpa.hibernate.ddl-auto=validate
app.upload.dir=./uploads

# V99__seed_data.sql è intenzionalmente numerata alta per restare sempre l'ultima
# migration applicata (dati di riferimento). Qualunque nuova migration di schema
# "vera" avrà quindi sempre un numero minore di 99 e verrebbe rifiutata da Flyway
# come fuori ordine, senza questa opzione.
spring.flyway.out-of-order=true