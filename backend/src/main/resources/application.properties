server.port=8081
# In sviluppo il backend accetta connessioni solo da questa macchina
server.address=${SERVER_ADDRESS:127.0.0.1}

# Cookie di sessione: non leggibile da JavaScript (HttpOnly), non inviato da
# altri siti nelle richieste POST (SameSite=Lax). In produzione, dietro HTTPS,
# SESSION_COOKIE_SECURE=true fa sì che il browser lo invii solo su HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Credenziali e configurazione locale: file .env nella root del repository
# (stesso file letto da docker compose). Viene cercato sia nella cartella di
# avvio sia in quella superiore, così funziona lanciando il backend dalla root
# o da backend/. Le variabili d'ambiente reali hanno la precedenza.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:studyhub_db}
spring.datasource.username=${DB_USERNAME:studyhub_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
app.upload.dir=./uploads
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Username (già registrati) da promuovere a moderatore all'avvio, separati da virgola
app.moderatori=${MODERATORS:}

# V99__seed_data.sql è intenzionalmente numerata alta per restare sempre l'ultima
# migration applicata (dati di riferimento). Qualunque nuova migration di schema
# "vera" avrà quindi sempre un numero minore di 99 e verrebbe rifiutata da Flyway
# come fuori ordine, senza questa opzione.
spring.flyway.out-of-order=true